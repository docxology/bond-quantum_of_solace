# Claim ledger: sourced numeric claims for evidence-registry validation.
# All values are COMPUTED by the real domain algorithms on fixed instances;
# evidence points at the exact module/function that produces them.
#
# This file is NOT trusted prose. tests/test_claim_ledger.py re-derives every
# entry from the live assessment and fails if a value here has drifted, so a
# stale claim is a test failure rather than a quiet lie. `token` names the
# manuscript variable that carries the same number into the paper.

claims:
  - id: "quantum.hydrology.total_supply"
    claim: "Total aquifer yield is 80.0 units per period"
    value: 80.0
    token: "HYDRO_TOTAL_SUPPLY"
    evidence: "quantum_of_solace.hydrology.default_network; analysis.assess_hydrology"
    determinism: true

  - id: "quantum.hydrology.network_delivery"
    claim: >-
      The whole network can route 80.0 units per period into its settlements.
      This is one max-flow with a super-source capped at each aquifer's yield,
      so it cannot exceed total_supply (80.0). It is ROUTED volume: evaporation
      is not deducted, and it bounds delivered volume from above.
    value: 80.0
    token: "HYDRO_NETWORK_DELIVERY"
    evidence: "quantum_of_solace.hydrology.delivery_capacity; analysis.assess_hydrology"
    determinism: true

  - id: "quantum.hydrology.border_delivery"
    claim: >-
      border_town can be routed 65.0 units per period when the network serves it
      alone. This is an ALTERNATIVE to valley_compact's 55.0, not an addend: the
      two settlements draw on the same aquifers and their sum (120.0) exceeds
      what the network can route in total.
    value: 65.0
    token: "RESULT_BORDER_DELIVERY"
    evidence: "quantum_of_solace.hydrology.delivery_capacity; analysis.assess_hydrology"
    determinism: true

  - id: "quantum.water_cartel.aggregate_leverage"
    claim: >-
      Controlling 2 of 3 dams at a 0.5 restriction withholds 0.256 of the
      fleet's downstream demand over the 12-period horizon. Numerator and
      denominator are both horizon volumes, so the value is a share in [0, 1].
    value: 0.256
    tolerance: 0.0005
    token: "RESULT_AGG_LEVERAGE"
    evidence: "quantum_of_solace.water_cartel.cartel_leverage; analysis.assess_water_cartel"
    determinism: true

  - id: "quantum.water_cartel.leverage_to_ownership"
    claim: >-
      The cartel holds 2 of 3 dams (66.7% of the fleet, a controlling share) and
      converts it into 25.6% of horizon demand withheld — a ratio of 0.38. The
      converted share is BELOW the ownership share, not a multiple of it.
    value: 0.38
    tolerance: 0.005
    token: "CARTEL_LEVERAGE_OWNERSHIP_RATIO"
    evidence: "quantum_of_solace.analysis.assess_water_cartel (leverage_to_ownership)"
    determinism: true

  - id: "quantum.pricing.point_elasticity"
    claim: >-
      Magnitude of the point price elasticity of demand at the baseline is 0.869
      = p/(b*q) = 46.483/(0.25*214.067). Below 1, so demand is inelastic there;
      the proportional price rise exceeds the proportional volume cut by exactly
      1/0.869.
    value: 0.869
    tolerance: 0.0005
    token: "PRICE_ELASTICITY"
    evidence: "quantum_of_solace.pricing.point_elasticity; analysis.assess_pricing"
    determinism: true

  - id: "quantum.resilience.worst_case_retention"
    claim: >-
      The single worst aqueduct cut retains 0.750 of routed volume. This, not
      the 0.917 mean index, is the worst-case bound.
    value: 0.750
    tolerance: 0.0005
    token: "RESIL_WORST_RETENTION"
    evidence: "quantum_of_solace.resilience.single_route_criticality; analysis.assess_resilience"
    determinism: true

  - id: "quantum.cartel_graph.aggregate_hhi"
    claim: "Portfolio-mean Herfindahl-Hirschman index is 3925 points (highly concentrated)"
    value: 3925.0
    token: "RESULT_AGG_HHI"
    evidence: "quantum_of_solace.cartel_graph.hhi; analysis.assess_cartel_graph"
    determinism: true

  - id: "quantum.pricing.restricted_price"
    claim: "Cutting supply raises the clearing water price to 64.4"
    value: 64.4
    tolerance: 0.05
    token: "PRICE_RESTRICTED"
    evidence: "quantum_of_solace.pricing.scarcity_impact; analysis.assess_pricing"
    determinism: true

  - id: "quantum.resilience.index"
    claim: >-
      MEAN routed volume retained across the six single-aqueduct cuts is 0.917.
      This is an average, not a guarantee; the worst single cut is recorded
      separately as quantum.resilience.worst_case_retention.
    value: 0.917
    tolerance: 0.0005
    token: "RESIL_INDEX"
    evidence: "quantum_of_solace.resilience.resilience_index; analysis.assess_resilience"
    determinism: true

  - id: "quantum.shapley.leading_actor_value"
    claim: "The leading actor's exact Shapley value over the commodity portfolio is 2.624"
    value: 2.624
    tolerance: 0.0005
    token: "SHAPLEY_QUANTUM"
    evidence: "quantum_of_solace.shapley.shapley_value; analysis.assess_shapley"
    determinism: true

algorithm_attributions:
  - {algorithm: "Dijkstra shortest path", reference: "dijkstra1959note", module: "hydrology.shortest_route"}
  - {algorithm: "Edmonds-Karp maximum flow", reference: "edmonds1972theoretical", module: "hydrology.max_flow"}
  - {algorithm: "Max-flow/min-cut theorem", reference: "ford1956maximal", module: "resilience.minimum_cut"}
  - {algorithm: "Deterministic network interdiction", reference: "wood1993deterministic", module: "resilience.interdiction_sequence"}
  - {algorithm: "Herfindahl-Hirschman index", reference: "hirschman1945national", module: "cartel_graph.hhi"}
  - {algorithm: "HHI concentration bands", reference: "doj2010merger", module: "cartel_graph.concentration_band"}
  - {algorithm: "Reservoir mass-balance simulation", reference: "loucks2017water", module: "water_cartel.run_reservoir"}
  - {algorithm: "Shapley value", reference: "shapley1953value", module: "shapley.shapley_value"}
  - {algorithm: "Banzhaf-Coleman power index", reference: "banzhaf1965weighted", module: "shapley.banzhaf_power"}
