# QUANTUM — Quantum of Solace (2008) film mission package.
# BOND suite: local-only working tree in projects/working/bond/. Never push.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-of-solace"
version = "0.1.0"
license = {text = "MIT"}
description = "Quantum of Solace (2008) — water-rights cartel, desert hydrology, and commodity-cartel graph mission software for PROJECT BOND."
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"},
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0",
]

# bond-api is the FROZEN protocol contract (the only suite dependency this
# package binds to). The pure domain modules import nothing from it; only
# mission.py imports bond_api.
[tool.uv.sources]
bond-api = { path = "vendor/bond-api" }

# Lint settings are declared locally so a standalone clone of this package lints
# identically to the in-suite checkout. Without this block ruff walks up and
# resolves the enclosing template repository's configuration, which a fork would
# not have. The rule set mirrors that configuration deliberately.
[tool.ruff]
# The vendored copies are byte-identical to upstream and must stay that way.
extend-exclude = ["vendor"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E741",  # short math variable names are idiomatic in the domain models
]

[tool.ruff.lint.per-file-ignores]
# Thin orchestrators bootstrap sys.path before importing the package.
"scripts/*.py" = ["E402", "E501"]
# Long prose lines inside domain-model docstrings.
"src/**" = ["E501"]
"tests/**/*.py" = ["E712", "E402", "E501"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# The package lives under a src/ layout; point mypy at it so its own modules
# resolve, alongside bond_api (installed into the project venv).
# Vendored copies are a dependency; their bytes are bound by scripts/vendor.py.
exclude = ["(^|/)vendor/"]
mypy_path = ["src"]
explicit_package_bases = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

# bond_api ships without a py.typed marker; it is the frozen protocol contract
# and we bind to it structurally, so skip analyzing its internals.
[[tool.mypy.overrides]]
module = "bond_api.*"
ignore_missing_imports = true
