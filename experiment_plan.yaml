# Experiment plan for the QUANTUM film assessment (declarative).

mission:
  film: "Quantum of Solace"
  codename: "QUANTUM"

conditions:
  hydrology_network: "default_network (3 aquifers, 6 routes, 2 settlements)"
  reservoir_horizon_periods: 12
  restriction_frac: 0.5
  controlled_dams: ["highland_reservoir", "desert_holding"]
  cartel_model: "default_cartel (quantum, rival_syndicate, state_utility)"

primary_metric:
  name: "aggregate cartel leverage"
  definition: >-
    Total volume withheld by the controlled dams over the horizon, divided by
    the demand the whole fleet serves over the same horizon
    (sum of per-period downstream_demand x periods). Both sides are horizon
    volumes, so the metric is a dimensionless share in [0, 1].
  source: "quantum_of_solace.analysis.assess_water_cartel"

secondary_metrics:
  - name: "settlement max-flow delivery"
    source: "quantum_of_solace.analysis.assess_hydrology"
  - name: "portfolio-mean HHI"
    source: "quantum_of_solace.analysis.assess_cartel_graph"
  - name: "scarcity price rise fraction"
    source: "quantum_of_solace.analysis.assess_pricing"
  - name: "single-cut resilience index"
    source: "quantum_of_solace.analysis.assess_resilience"
  - name: "leading-actor Shapley value"
    source: "quantum_of_solace.analysis.assess_shapley"

expected_figures:
  - output/figures/hydrology_settlement_delivery.png
  - output/figures/water_cartel_leverage.png
  - output/figures/cartel_hhi_concentration.png
  - output/figures/water_pricing_curve.png
  - output/figures/resilience_route_criticality.png
  - output/figures/cartel_shapley_power.png

expected_tables:
  - "per-dam leverage breakdown (water_cartel report)"
  - "per-route interdiction criticality (resilience_report)"
  - "per-actor Shapley / Banzhaf power (shapley assessment)"

baseline: "unrestricted reservoir operation (restriction_frac=0)"
ablation:
  - "toggle controlled dams to measure marginal leverage"
  - "remove the most critical aqueduct and recompute scarcity price"
  - "drop commodity weights to test Shapley ranking stability"
