# Advisory domain profile for the QUANTUM film package (validation input only).

domain: "special-agent mission software for Quantum of Solace (2008)"
codename: "QUANTUM"

review_gates:
  coverage_min_percent: 90
  zero_mocks: true
  deterministic: true
  ruff: true
  mypy: true

source_policy:
  local_only: true
  push_remote: false
  bind_dependencies:
    - "bond-api (frozen protocol adapter)"

artifact_expectations:
  - src/quantum_of_solace/hydrology.py
  - src/quantum_of_solace/water_cartel.py
  - src/quantum_of_solace/cartel_graph.py
  - src/quantum_of_solace/mission.py
  - scripts/run_mission.py
  - manuscript/[0-9]*.md

benchmark_rubric:
  primary_metric: "aggregate cartel leverage"
  secondary_metrics:
    - "settlement max-flow delivery"
    - "portfolio-mean HHI concentration"
